[package]
name = "monero-payment-proofs"
version = "0.1.0"
description = "Payment proofs for the Monero protocol"
license = "MIT"
authors = ["Luke Parker <lukeparker5132@gmail.com>"]
edition = "2021"

[dependencies]
std-shims = { version = "0.1.4", default-features = false }

zeroize = { version = "^1.5", default-features = false, features = ["zeroize_derive"] }
rand_core = { version = "0.6", default-features = false }

sha3 = { version = "0.10", default-features = false }
curve25519-dalek = { version = "4.1", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"] }

monero-oxide = { version = "0.1.0", default-features = false }
monero-wallet = { version = "0.2.0", default-features = false }

# monero-oxide pulls rand_core/getrandom, which needs its js backend to build for wasm32
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[features]
std = [
  "std-shims/std",

  "zeroize/std",
  "rand_core/std",

  "sha3/std",

  "monero-oxide/std",
  "monero-wallet/std",
]
default = ["std"]
