[package]
name = "monero-seed"
version = "0.1.0"
description = "Rust implementation of Monero's seed algorithm"
license = "MIT"
repository = "https://github.com/kayabaNerve/monero-wallet-util/tree/develop/seed"
authors = ["Luke Parker <lukeparker5132@gmail.com>"]
edition = "2021"

[dependencies]
std-shims = { version = "0.1.4", default-features = false }

thiserror = { version = "1", default-features = false, optional = true }

zeroize = { version = "^1.5", default-features = false, features = ["zeroize_derive"] }
rand_core = { version = "0.6", default-features = false }

curve25519-dalek = { version = "^3.2", default-features = false, features = ["std"] }

[dev-dependencies]
hex = { version = "0.4", default-features = false, features = ["std"] }
sha3 = "0.10"

[features]
std = [
  "std-shims/std",

  "thiserror",

  "zeroize/std",
  "rand_core/std",
]
default = ["std"]
