[package]
name = "monero-payment-proofs"
version = "0.1.0"
description = "Payment proofs for the Monero protocol"
license = "MIT"
authors = ["Luke Parker <lukeparker5132@gmail.com>"]
edition = "2021"

[dependencies]
std-shims = { version = "0.1.4", default-features = false }

zeroize = { version = "^1.5", default-features = false, features = ["zeroize_derive"] }
rand_core = { version = "0.6", default-features = false }

sha3 = { version = "0.10", default-features = false }
curve25519-dalek = { version = "4.1", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"] }

monero-oxide = { git = "https://github.com/monero-oxide/monero-oxide", rev = "946ec5f00ff071b129758ee8cba5528539fccfe4", package = "monero-oxide", default-features = false }
monero-wallet = { git = "https://github.com/monero-oxide/monero-oxide", rev = "946ec5f00ff071b129758ee8cba5528539fccfe4", package = "monero-wallet", default-features = false }

[features]
std = [
  "std-shims/std",

  "zeroize/std",
  "rand_core/std",

  "sha3/std",

  "monero-oxide/std",
  "monero-wallet/std",
]
default = ["std"]
