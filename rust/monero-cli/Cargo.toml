[package]
name = "monero-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
monero-rust = { path = "../monero-rust" }
monero-serai = { path = "../monero-serai-mirror", features = ["http-rpc"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rpassword = "7"
indicatif = "0.17"
dirs = "5"
hex = "0.4"
zeroize = "1"
rand = "0.8"
