[package]
name = "monero-rust"
version = "0.0.4"
edition = "2021"

[features]
default = []
test-helpers = []
mock-rpc = []

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
# Key-image signing uses getrandom on every target. Enable its "js" feature only
# for wasm32 so native builds do not pull in wasm-bindgen and js-sys.
getrandom = "0.2"
thiserror = "1.0"
async-trait = "0.1"
futures = "0.3"
base64 = "0.21"
zeroize = { version = "1.7", features = ["zeroize_derive"] }
base58-monero = { version = "1", default-features = false, features = ["check"] }
log = "0.4"
ur = { version = "0.4", default-features = false }
qrcode = { version = "0.14", default-features = false }

# Encryption
chacha20poly1305 = "0.10"
chacha20 = "0.9"
cipher = "0.4"
argon2 = "0.5"
serde_bytes = "0.11"
# Use the Cuprate revision previously vendored here; the crates.io package
# is a placeholder.
cuprate-cryptonight = { git = "https://github.com/Cuprate/cuprate", rev = "b6a0302c8189187c7b85059c81086858bd4e4352" }
crc = "3"
lazy_static = "1" 
# This revision includes the nested-struct and byte-blob deserialization fixes
# needed for wallet and RPC data. Those fixes are absent from crates.io 1.0.1.
monero-epee-bin-serde = { git = "https://github.com/comit-network/monero-epee-bin-serde", rev = "fae7a23f8e57f19553c341c0878b4f0fa5a6994d" }
monero-oxide = { version = "0.1.0", default-features = false, features = ["std"] }
monero-wallet = { version = "0.2.0", default-features = false, features = ["std"] }

# BIP39/BIP32
bip39 = { version = "2", features = ["rand"] }
bip32 = { version = "0.5", features = ["secp256k1"] }

# Scanner
curve25519-dalek = { version = "4.1", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"] }
sha3 = { version = "0.10", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
rand_core = { version = "0.6", default-features = false }
rand = { version = "0.8", default-features = false, features = ["getrandom"] }
rand_distr = { version = "0.4", default-features = false, features = ["std"] }

# WebAssembly support
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }

# Native
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
curve25519-dalek = { version = "4.1", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"] }
sha3 = "0.10"
hex = "0.4"
rand_core = "0.6"
rand = "0.8"
tokio = { version = "1.29", features = ["rt", "macros"] }
reqwest = { version = "0.12", features = ["json"] }
digest_auth = "0.3"

[dev-dependencies]
reqwest = "0.12"
tempfile = "3"
rand_chacha = "0.3"

# Only wasm32 tests use wasm-bindgen-test.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

# Tokio is only needed for native tests
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.29", features = ["full"] }
# Criterion depends on Rayon and cannot build for wasm32.
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "scanning"
harness = false
