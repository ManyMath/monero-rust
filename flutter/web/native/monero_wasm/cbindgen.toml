# cbindgen configuration for native FFI header generation.
#
# Regenerate with:
#   cbindgen --config cbindgen.toml --crate monero_wasm --output include/bindings.h

language = "C"
include_guard = "MONERO_WASM_BINDINGS_H"

[defines]
# Map Rust cfg predicates to C preprocessor guards.
# Since we only emit native FFI (not wasm32), treat not(wasm32) as always true.
"target_arch = \"wasm32\"" = "MONERO_WASM_TARGET_WASM32"

[export]
include = [
    "HubHandle",
    "RustSignalCallback",
]
